name: Update AI Pulse

# Runs from GitHub's cloud — independent of any home machine. $0 forever.
# Every 4 hours, plus manual runs, plus on every push to main.

on:
  schedule:
    - cron: "17 */4 * * *"   # 00:17, 04:17, 08:17, 12:17, 16:17, 20:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write      # commit updated data/history.json back to the repo
  pages: write         # deploy to GitHub Pages
  id-token: write      # required by actions/deploy-pages
  models: read         # free GitHub Models tier for the daily AI briefing

concurrency:
  group: ai-pulse-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python build.py

      - name: Persist history
        continue-on-error: true   # a transient push failure must never block the deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes this run"
          else
            git commit -m "data: auto-update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push || (git pull --rebase --autostash origin main && git push)
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # auto-enable GitHub Pages (build_type: workflow)

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
